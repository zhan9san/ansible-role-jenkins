---
- name: Verify Jenkins systemd unit environment variables
  hosts: all
  tasks:
    - name: Read override.conf content
      ansible.builtin.slurp:
        src: /etc/systemd/system/jenkins.service.d/override.conf
      register: override_conf_content

    - name: Decode override.conf content
      ansible.builtin.set_fact:
        override_conf_decoded: "{{ override_conf_content.content | b64decode }}"

    - name: Print decoded override.conf content
      ansible.builtin.debug:
        var: override_conf_decoded

    - name: Assert JAVA_OPTS is present
      ansible.builtin.assert:
        that:
          - "'JAVA_OPTS=-Djenkins.install.runSetupWizard=false' in override_conf_decoded"
        fail_msg: "JAVA_OPTS is not set correctly in override.conf."

    - name: Assert JENKINS_LISTEN_ADDRESS is present
      ansible.builtin.assert:
        that:
          - "'JENKINS_LISTEN_ADDRESS=127.0.0.1' in override_conf_decoded"
        fail_msg: "JENKINS_LISTEN_ADDRESS is not set correctly in override.conf."

- name: Verify Jenkins plugins
  hosts: all
  tasks:
    - name: Find installed plugin archives
      ansible.builtin.find:
        paths: /var/lib/jenkins/plugins
        patterns: "*.jpi"
      register: plugin_archives

    - name: Find plugin files not owned by jenkins
      ansible.builtin.command:
        cmd: find /var/lib/jenkins/plugins -maxdepth 1 ! -user jenkins
      register: plugins_not_owned
      changed_when: false

    - name: Assert plugins are installed and owned by jenkins
      ansible.builtin.assert:
        that:
          - plugin_archives.matched > 0
          - plugins_not_owned.stdout_lines | length == 0
        fail_msg: "Plugins are missing or not owned by jenkins: {{ plugins_not_owned.stdout_lines }}"

- name: Verify Nginx remote API depth limit
  hosts: all
  tasks:
    - name: Reject a remote API call deeper than jenkins_api_max_depth
      ansible.builtin.uri:
        url: http://127.0.0.1/api/json?depth=3
        headers:
          Host: jenkins.example.com
        status_code: 400
      when: jenkins_nginx_proxy | default(true) | bool

    # Jenkins may answer 200/403/503 here; only the Nginx 400 counts as a failure
    - name: Pass allowed depth and non-API paths through to Jenkins
      ansible.builtin.uri:
        url: "http://127.0.0.1{{ item }}"
        headers:
          Host: jenkins.example.com
      register: api_passthrough
      failed_when: api_passthrough.status == 400
      loop:
        - /api/json?depth=2
        - /view/all/itemCategories?depth=3
      when: jenkins_nginx_proxy | default(true) | bool
